services:
  - type: web
    name: 3gpp-log-analyzer
    runtime: python
    region: oregon
    plan: free

    buildCommand: pip install -r requirements.txt

    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1

    healthCheckPath: /health

    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: GROQ_MODEL
        value: groq/compound-mini
      - key: CHROMA_DB_PATH
        value: ./chroma_db
      - key: KNOWLEDGE_BASE_PATH
        value: ./knowledge_base
      # GROQ_API_KEY must be set manually in Render dashboard (secret)
